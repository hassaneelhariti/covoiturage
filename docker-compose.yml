services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: covoiturage
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: dev-only-secret-change-me
      DATABASE_URL: "mysql://app:app@db:3306/covoiturage?serverVersion=8.0&charset=utf8mb4"
      GEO_USER_AGENT: "covoiturage-pfe/1.0 (contact: you@example.com)"
    ports:
      - "8080:80"

volumes:
  dbdata:
