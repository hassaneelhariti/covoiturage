parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Exception/'
            - '../src/Kernel.php'

    App\Service\GeoService:
        arguments:
            $userAgent: '%env(GEO_USER_AGENT)%'
